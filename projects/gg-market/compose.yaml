services:
  postgres:
    image: postgres:17
    container_name: oks-postgres
    environment:
      POSTGRES_DB: oks-postgres
      POSTGRES_USER: oks
      POSTGRES_PASSWORD: ${OKS_DB_PASSWORD:?Set OKS_DB_PASSWORD in .env}
    ports:
      - 5433:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
    name: oks-postgres-data
    external: true
